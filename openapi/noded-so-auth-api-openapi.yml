components:
  schemas:
    GetAuthConnectResponse:
      type: object
      properties:
        type:
          type: string
          description: Either "redirect" (OAuth) or "html" (key form).
        url:
          type: string
          description: When type is "redirect", the OAuth URL.
        html:
          type: string
          description: When type is "html", the HTML form to render.
    PostAuthRefreshRequest:
      type: object
      properties:
        connectedProvider:
          type: object
          description: Object containing the existing credential.
      required:
      - connectedProvider
    GetAuthCallbackResponse:
      type: object
      properties:
        connectionId:
          type: string
          description: The connection ID to associate with the registration.
        credential:
          type: object
          description: Credential object containing accessToken, refreshToken, etc.
    PostAuthCheckRequest:
      type: object
      properties:
        application:
          type: string
          description: The application to validate.
        credential:
          type: object
          description: Credential to validate.
      required:
      - application
      - credential
    PostAuthRefreshResponse:
      type: object
      properties:
        credential:
          type: object
          description: Refreshed credential (accessToken, refreshToken, dateExpiry, etc.).
    PostAuthCheckResponse:
      type: object
      properties:
        status:
          type: string
          description: '"ok" or "scope_required".'
        message:
          type: string
          description: Human‑readable message when status is "scope_required".
