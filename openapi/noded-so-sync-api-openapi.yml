components:
  schemas:
    PostSyncCalendarResponse:
      type: object
      properties:
        items:
          type: array
          description: Array of Calendar objects.
        metadata:
          type: object
        pagination:
          type: object
          description: 'hasMore: false, pageSize.'
    PostSyncTranscriptionRequest:
      type: object
      properties:
        connectedProvider:
          type: object
          properties:
            connectionId:
              type: string
            provider:
              type: string
            application:
              type: string
            credential:
              type: object
              properties:
                accessToken:
                  type: string
                email:
                  type: string
        transcriptionFilter:
          type: object
          properties:
            dateStart:
              type: integer
            dateEnd:
              type: integer
            limit:
              type: integer
    PostSyncMetadataRequest:
      type: object
      properties:
        credential:
          type: object
        tableMetadata:
          type: array
          description: Definitions of tables from the platform.
      required:
      - credential
      - tableMetadata
    PostSyncIdentifierRequest:
      type: object
      properties:
        credential:
          type: object
        externalIdLinkObjects:
          type: array
          description: Slots to resolve (metadataType, tagType, hints).
      required:
      - credential
      - externalIdLinkObjects
    PostSyncMetadataResponse:
      type: object
      properties:
        items:
          type: array
          description: Array of enriched Table objects.
        metadata:
          type: object
        pagination:
          type: object
          description: 'hasMore: false, pageSize.'
    PostSyncCalendarRequest:
      type: object
      properties:
        credential:
          type: object
        calendarFilter:
          type: object
          description: dateStart, dateEnd, limit.
      required:
      - credential
      - calendarFilter
    PostSyncInsightResponse:
      type: object
      properties:
        items:
          type: array
          description: Array of TagInsightResponse objects (blockType, tables).
        metadata:
          type: object
        pagination:
          type: object
          description: 'hasMore: false, pageSize.'
    PostSyncIdentifierResponse:
      type: object
      properties:
        items:
          type: array
          description: Array of ExternalObjectWithUrl objects.
        metadata:
          type: object
        pagination:
          type: object
          description: 'hasMore: false, pageSize.'
    PostSyncTableRequest:
      type: object
      properties:
        credential:
          type: object
        recordFilter:
          type: object
          description: recordTypeFilters with tableMetadata and externalIds.
      required:
      - credential
      - recordFilter
    PostSyncEmailResponse:
      type: object
      properties:
        items:
          type: array
          description: Array of Email objects.
        metadata:
          type: object
        pagination:
          type: object
          description: hasMore, cursor, pageSize.
    PostSyncTableResponse:
      type: object
      properties:
        items:
          type: array
          description: Array of Table objects each containing rows.
        metadata:
          type: object
        pagination:
          type: object
          description: 'hasMore: false, pageSize.'
    PostSyncInsightRequest:
      type: object
      properties:
        credential:
          type: object
        insightTypeFilters:
          type: array
          description: Filters describing which tags to produce insights for.
      required:
      - credential
      - insightTypeFilters
    PostSyncEmailRequest:
      type: object
      properties:
        credential:
          type: object
        filter:
          type: object
          description: dateStart, dateEnd, limit, cursor, includeEmails.
      required:
      - credential
      - filter
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
