components:
  schemas:
    PostApplicationLinkRequest:
      type: object
      properties:
        url:
          type: string
          description: The pasted URL.
        callbackId:
          type: string
          description: 'For slow fetches: identifier for later callback.'
        callbackUrl:
          type: string
          description: 'For slow fetches: URL to POST the finished result.'
      required:
      - url
    PostApplicationLinkResponse:
      type: object
      properties:
        businessObject:
          type: object
          description: The document with title, content, uri and stable externalId.
        processingStage:
          type: string
          description: Either "processed" or "processing".
    PostApiV1GraphRequest:
      type: object
      properties:
        query:
          type: string
    PostApiV1GraphResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            tenant:
              type: object
              properties:
                _id:
                  type: string
                email:
                  type: string
                tagId:
                  type: string
    GetApiV1HelloResponse:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    GetAuthCallbackResponse:
      type: object
      properties:
        connectionId:
          type: string
          description: The connection ID to associate with the registration.
        credential:
          type: object
          description: Credential object containing accessToken, refreshToken, etc.
    PostAuthCheckRequest:
      type: object
      properties:
        application:
          type: string
          description: The application to validate.
        credential:
          type: object
          description: Credential to validate.
      required:
      - application
      - credential
    PostAuthCheckResponse:
      type: object
      properties:
        status:
          type: string
          description: '"ok" or "scope_required".'
        message:
          type: string
          description: Human‑readable message when status is "scope_required".
    GetAuthConnectResponse:
      type: object
      properties:
        type:
          type: string
          description: Either "redirect" (OAuth) or "html" (key form).
        url:
          type: string
          description: When type is "redirect", the OAuth URL.
        html:
          type: string
          description: When type is "html", the HTML form to render.
    PostAuthRefreshRequest:
      type: object
      properties:
        connectedProvider:
          type: object
          description: Object containing the existing credential.
      required:
      - connectedProvider
    PostAuthRefreshResponse:
      type: object
      properties:
        credential:
          type: object
          description: Refreshed credential (accessToken, refreshToken, dateExpiry, etc.).
    PostExecuteFunctionRequest:
      type: object
      properties:
        functionName:
          type: string
          description: Which function to run.
        configuration:
          type: array
          description: Install‑time values.
        values:
          type: array
          description: Per‑run input values matching resolveInputs.
        templateConnectedProvider:
          type: object
          description: Connection of the installer (for reading assets).
        outputConnectedProvider:
          type: object
          description: Connection of the executor (for writing results).
      required:
      - functionName
      - configuration
      - values
    PostExecuteFunctionResponse:
      type: object
      properties:
        outputUrl:
          type: string
          description: URL of a result to attach.
        externalId:
          type: string
          description: Vendor ID of the created object.
        uri:
          type: string
          description: Link back to the created object.
    PostExecuteQueryRequest:
      type: object
      properties:
        metadataType:
          type: string
          description: Vendor object type to search.
        searchCriteria:
          type: array
          description: List of {fieldName, operator, value} objects.
        returnFields:
          type: array
          description: Fields to include in each result.
        limit:
          type: number
          description: Maximum records to return.
      required:
      - metadataType
      - searchCriteria
    PostExecuteQueryResponse:
      type: object
      properties:
        records:
          type: array
          description: Each record with provider, application, metadataType, externalId, title, uri and values.
        hasMore:
          type: boolean
          description: True when more matches exist beyond the limit.
    PostInstallFunctionInputsRequest:
      type: object
      properties:
        functionName:
          type: string
          description: Which declared function is being installed.
        configuration:
          type: array
          description: Name/value pairs the user set at install time.
      required:
      - functionName
      - configuration
    PostInstallFunctionInputsResponse:
      type: object
      properties:
        inputs:
          type: array
          description: Each input with name, label and default valueSource.
    PostSyncCalendarRequest:
      type: object
      properties:
        credential:
          type: object
        calendarFilter:
          type: object
          description: dateStart, dateEnd, limit.
      required:
      - credential
      - calendarFilter
    PostSyncCalendarResponse:
      type: object
      properties:
        items:
          type: array
          description: Array of Calendar objects.
        metadata:
          type: object
        pagination:
          type: object
          description: 'hasMore: false, pageSize.'
    PostSyncEmailRequest:
      type: object
      properties:
        credential:
          type: object
        filter:
          type: object
          description: dateStart, dateEnd, limit, cursor, includeEmails.
      required:
      - credential
      - filter
    PostSyncEmailResponse:
      type: object
      properties:
        items:
          type: array
          description: Array of Email objects.
        metadata:
          type: object
        pagination:
          type: object
          description: hasMore, cursor, pageSize.
    PostSyncIdentifierRequest:
      type: object
      properties:
        credential:
          type: object
        externalIdLinkObjects:
          type: array
          description: Slots to resolve (metadataType, tagType, hints).
      required:
      - credential
      - externalIdLinkObjects
    PostSyncIdentifierResponse:
      type: object
      properties:
        items:
          type: array
          description: Array of ExternalObjectWithUrl objects.
        metadata:
          type: object
        pagination:
          type: object
          description: 'hasMore: false, pageSize.'
    PostSyncInsightRequest:
      type: object
      properties:
        credential:
          type: object
        insightTypeFilters:
          type: array
          description: Filters describing which tags to produce insights for.
      required:
      - credential
      - insightTypeFilters
    PostSyncInsightResponse:
      type: object
      properties:
        items:
          type: array
          description: Array of TagInsightResponse objects (blockType, tables).
        metadata:
          type: object
        pagination:
          type: object
          description: 'hasMore: false, pageSize.'
    PostSyncMetadataRequest:
      type: object
      properties:
        credential:
          type: object
        tableMetadata:
          type: array
          description: Definitions of tables from the platform.
      required:
      - credential
      - tableMetadata
    PostSyncMetadataResponse:
      type: object
      properties:
        items:
          type: array
          description: Array of enriched Table objects.
        metadata:
          type: object
        pagination:
          type: object
          description: 'hasMore: false, pageSize.'
    PostSyncTableRequest:
      type: object
      properties:
        credential:
          type: object
        recordFilter:
          type: object
          description: recordTypeFilters with tableMetadata and externalIds.
      required:
      - credential
      - recordFilter
    PostSyncTableResponse:
      type: object
      properties:
        items:
          type: array
          description: Array of Table objects each containing rows.
        metadata:
          type: object
        pagination:
          type: object
          description: 'hasMore: false, pageSize.'
    PostSyncTranscriptionRequest:
      type: object
      properties:
        connectedProvider:
          type: object
          properties:
            connectionId:
              type: string
            provider:
              type: string
            application:
              type: string
            credential:
              type: object
              properties:
                accessToken:
                  type: string
                email:
                  type: string
        transcriptionFilter:
          type: object
          properties:
            dateStart:
              type: integer
            dateEnd:
              type: integer
            limit:
              type: integer
    PostTagRequest:
      type: object
      properties:
        search:
          type: string
          description: Free text the user typed.
        externalId:
          type: string
          description: Look one object up directly instead of searching.
        tagType:
          type: string
          description: person or topic – what kind of tag the caller wants back.
        metadataType:
          type: string
          description: Which vendor object type to search, like "account" or "user".
      required:
      - tagType
      - metadataType
    PostTagResponse:
      type: object
      properties:
        items:
          type: array
          description: Array of Tag objects, each with alias, tagType and externalId.
    PostUpsertNotesRequest:
      type: object
      properties:
        externalNotes:
          type: array
          description: Array of notes, each with title, documentHtml, uri, tags and optional externalId.
      required:
      - externalNotes
    PostUpsertNotesResponse:
      type: object
      properties:
        externalNotes:
          type: array
          description: Notes returned with externalId set to the vendor's ID.
    PostUpsertTableRequest:
      type: object
      properties:
        table:
          type: object
          description: Table to write; includes metadata.metadataType and records.
      required:
      - table
    PostUpsertTableResponse:
      type: object
      properties:
        table:
          type: object
          description: The same Table with every record's externalId filled in.
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
security:
- bearer: []
tags:
- name: Api
- name: Auth
- name: Execute
- name: Install
- name: Link
- name: Sync
- name: Tag
- name: Upsert
